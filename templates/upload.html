<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importer un Nouveau Dataset — ML Pipeline Studio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>try{var a=localStorage.getItem('mls.accent');if(a)document.documentElement.dataset.accent=a;if(localStorage.getItem('mls.chartsmode')==='dark')document.documentElement.classList.add('charts-dark')}catch(e){}</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body class="choose-dataset-page" style="align-items: flex-start;">
  <!-- ========================================================================
       DEDICATED UPLOAD PAGE
       ======================================================================== -->
  <main class="container page1-container" style="max-width: 720px; margin: 3rem auto;">

    <div style="margin-bottom: 1.5rem;">
      <a href="{{ url_for('index') }}" class="btn btn-outline">
        <span>←</span>
        <span>Retour aux datasets</span>
      </a>
    </div>

    <section class="independent-upload-section" id="uploadSection" style="margin-top: 0;">
      <div class="independent-upload-card" id="independentUploadCase">
        <h2 class="upload-case-title" style="margin-bottom: 1.25rem;">Importer un dataset</h2>

        <form id="independentAnalysisForm" class="upload-case-form">
          <!-- Champs cachés (remplis automatiquement par le JS) -->
          <input type="hidden" id="indepDatasetName" name="dataset_name">
          <input type="hidden" id="indepDateColumn" name="date_column">

          <div class="independent-dropzone" id="independentDropzone" onclick="document.getElementById('indepCsvFileInput').click()">
            <input type="file" id="indepCsvFileInput" name="csv_file" accept=".csv,.tsv" style="display: none;">
            <div class="dropzone-visual">
              <div class="dropzone-cloud-icon">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="56" height="56">
                  <path d="M16 44 C11.6 44 8 40.4 8 36 C8 32 11 28.6 15 28.1 C16.5 20.6 23.1 15 31 15 C39.5 15 46.4 21.4 47.3 29.8 C52.2 30.5 56 34.7 56 39.8 C56 45.4 51.5 50 46 50 H18" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M32 30 V46" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round" />
                  <path d="M24 37 L32 29 L40 37" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
              <h4 class="dropzone-text" id="indepFileNameDisplay">Déposez votre fichier CSV ici</h4>
              <p class="dropzone-hint" id="indepFileHint">ou cliquez pour parcourir</p>

              <div class="file-info-pill" id="indepFileInfoPill" style="display: none;">
                <span class="file-check">✓</span>
                <span class="file-name" id="indepSelectedName">fichier.csv</span>
                <span class="file-size" id="indepSelectedSize">0 KB</span>
              </div>
            </div>
          </div>

          <div class="upload-case-footer" style="margin-top: 1.25rem; padding-top: 0; border-top: none;">
            <div id="indepStatusMsg" class="upload-status-box" style="display: none;"></div>

            <div class="upload-action-buttons">
              <button type="reset" class="btn btn-outline">Réinitialiser</button>
              <button type="submit" id="indepSubmitBtn" class="btn btn-primary btn-launch">
                <span id="indepSpinner" class="spinner" style="display: none;"></span>
                <svg id="indepSubmitIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                <span id="indepSubmitText">Lancer l'analyse</span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% include 'components/fx.html' %}
</body>
</html>
